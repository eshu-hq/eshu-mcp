name: contract-parity

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check contract parity invariants
        run: python3 scripts/check-parity.py
      - name: Check for whitespace errors
        run: git diff --check
