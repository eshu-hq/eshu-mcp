# CI gates for eshu-mcp.
#
# Thin caller over the shared lane bodies in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml (v2, pinned below):
# this file holds the paths-filter `changes` job, the `go-ci` call with
# this repo's run-gate wiring, and the two caller-side jobs the reusable
# cannot own (weekly findings issue, SARIF upload). Lane bodies
# (lint/test/race/shell/image/boundary/govulncheck/gosec/actionlint and
# the ci-complete aggregator) live upstream; check runs nest as
# `go-ci / <lane>`, and the top-level `ci-complete` alias job below
# mirrors `go-ci / ci-complete`, so the required `ci-complete` context
# keeps reporting with no ruleset change.
#
# Deltas vs the pre-move in-repo lanes (all disclosed in the move PR):
# - `image` also runs on Go-source changes (the Dockerfile `COPY . .`s and
#   go-builds them, so a Go-only PR must rebuild it).
# - Scheduled and branch-push runs execute every lane; the weekly schedule
#   previously ran govulncheck + gosec only.
# - `gosec` findings stay advisory on PRs; the Security-tab upload moves to
#   the caller-side `gosec-sarif` job below (non-PR events only, failures
#   fail loudly).
# - The weekly issue attributes via this run's failed check names and takes
#   the `security` label only when a security lane failed (base filed only
#   on govulncheck failure).
# - Branch pushes cancel superseded runs (previously PR runs only).
#
# Pinned actions (re-verify with git ls-remote when auditing; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   actions/download-artifact v7         37930b1c2abaa49bbe596cd826c3c89aef350131
#   github/codeql-action/upload-sarif v4.39.1 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
#   eshu-hq/.github v2                   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Go tools (every version passed explicitly as an input below, never the
# upstream default, so a default drift is a visible diff here):
#   golangci-lint v2.12.2, govulncheck v1.9.0 (-scan package),
#   gosec v2.30.0 (this repo's measured advisory baseline),
#   actionlint v1.7.12 (tarball, sha256-checked upstream).
name: ci

on:
  pull_request:
  push:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  # The `go-ci` reusable call needs contents:read at minimum: the callee
  # declares `permissions: contents: read`, and an empty grant starves the
  # call at load (startup_failure, zero jobs). Narrower caller-side jobs
  # keep their own blocks below.
  contents: read

# Cancel superseded runs per PR (or per ref for pushes and schedules).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Runs on every event on purpose: on push the filter outputs are unused
    # (lane conditions short-circuit on event), but every lane `needs` this
    # job — skipping it on push drags all lanes to skipped and the push run
    # goes vacantly green.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '*.example.*'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            misc:
              - '**'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/*.json'
              - '!**/*.yaml'
              - '!**/*.yml'
              - '!*.example.*'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'
              - '!.github/dependabot.yml'
              - '!README.md'
              - '!LICENSE'
              - '!**/*.md'

  go-ci:
    needs: [changes]
    # No timeout-minutes here: a reusable-call job accepts only name/uses/
    # with/secrets/needs/if/permissions (actionlint syntax-check rejects
    # the file otherwise), so the run ceiling lives in the upstream
    # inner-lane timeouts (lint/race/image 15, test/boundary/govulncheck
    # 10, gosec 30).
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: mcp
      go-version-file: go.mod
      coverage-floor: 80.3
      run-image: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      image-tag: eshu-mcp:ci
      image-context: .
      run-lint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-test: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-race: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-shell: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' }}
      run-boundary: false
      run-govulncheck: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true' }}
      run-gosec: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true' }}
      # Findings fail scheduled runs so the failure()-gated issue job
      # below is reachable; PR runs stay advisory green.
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      gosec-version: v2.30.0 # this repo's measured advisory baseline
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      actionlint-version: '1.7.12'
      run-actionlint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true' }}

  ci-complete:
    # Compatibility alias: mirrors `go-ci / ci-complete` so the required
    # `ci-complete` context keeps reporting after the move (check runs nest
    # as `go-ci / <lane>`). Same semantics as the upstream aggregator: any
    # needed-lane failure fails, legitimate skips pass.
    needs: [go-ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: mirror go-ci result
        run: |
          if [ "${{ needs.go-ci.result }}" = "success" ] || [ "${{ needs.go-ci.result }}" = "skipped" ]; then
            exit 0
          fi
          echo "go-ci result: ${{ needs.go-ci.result }}" >&2
          exit 1

  scheduled-findings:
    # The reusable runs contents:read-only, so weekly issue filing stays a
    # caller job. Fires only when go-ci failed on a schedule event, and
    # attributes by reading this run's failed check names (never assumes
    # the scans failed): the `security` label applies only when a failed
    # check is a security lane. Lists-or-comments instead of duplicating.
    needs: [go-ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: file or update the weekly findings issue
        run: |
          failed=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate --jq '[.jobs[] | select(.conclusion == "failure") | .name] | unique | join(", ")')
          title="[ci] weekly scheduled failure $(date -u +%F)"
          body="Scheduled CI failed on ${{ github.sha }}. Failed checks: ${failed}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          elif echo "$failed" | grep -qiE 'govulncheck|gosec'; then
            gh issue create --title "$title" --label security --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec-sarif:
    # Security-tab upload the reusable deliberately omits: caller-side,
    # non-PR events only. Upload failures fail this job loudly (no
    # continue-on-error): a red upload must never report green. Skips when
    # go-ci failed (including scheduled-finding runs): the finding count
    # stays in that run's summary and the weekly issue links the run.
    needs: [go-ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gosec-mcp
          path: ${{ github.workspace }}
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif
